# Stage-2 sparse refinement (LSRM-style), patch-8 arm. Plan 2026-09-27 (plan file, final section).
# Base = the stage-1 anneal config RnGUP_lagernvs_uni3t_b32t6_fp32lr35_wsd60k_a10k_all287k.yaml (the frozen
# stage 1 is built from it); differences: model.class_name + model.stage2, exp_name, api_key_path,
# weight_camera 0, exclude_bg_frac 0, schedule (warmup 1000, constant, 1-sqrt anneal 21000->26000),
# no stage-1 resume keys, checkpoint/validation keys of the stage-2 plan.
model:
  class_name: model_s2.stage2_wrapper.Stage2LagerNVS
  stage2:
    enabled: true
    stage1_ckpt: /mnt/data-alpha-sg-01/team-camera/home/z50057756/moe_experiments/checkpoints/PLN2uni3t_all287k_b32t6_fp32lr35_wsd60k_a10k/ckpt_0000000000070000.pt
    stage1_step: 70000
    target_patch: 8
    scene_radius: 2
    target_radius: 2
    vis_rel_tau: 0.03
    scene_block: 3
    target_block_px: 32
    attn_backend: sdpa
    pad_bucket: 128
  # UNI3T: three tasks at once. enabled=false reproduces the dense NVS-only arm
  # PLN2pose_all287k_b32t6_fp32lr35_const bit-for-bit.
  unified_heads:
    enabled: true
    renderer_dpt_layers: [2, 5, 8, 11]
  image_tokenizer:
    image_size: 256
    patch_size: 8
    in_channels: 9
  target_pose_tokenizer:
    image_size: 256
    patch_size: 8
    in_channels: 6
  pretrained_path: /home/z50057756/model/VGGT/model.pt
  rae_decoder:
    config_path: /home/z50057756/code/RAE/configs/decoder/ViTXL
