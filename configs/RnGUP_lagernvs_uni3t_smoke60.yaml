# UNI3T 1-GPU 60-step smoke. Same code path and same heads as the real arm;
# only batch / steps / warmup / logging cadence differ. The final step also
# saves one checkpoint and runs one validation, which is how the ckpt round-trip
# and the two new wandb curves (val/abs_rel, val/auc30) get exercised.
model:
  class_name: model.lagernvs_wrapper.LagerNVSInRnG
  # UNI3T: three tasks at once. enabled=false reproduces the dense NVS-only arm
  # PLN2pose_all287k_b32t6_fp32lr35_const bit-for-bit.
  unified_heads:
    enabled: true
    renderer_dpt_layers: [2, 5, 8, 11]
  image_tokenizer:
    image_size: 256
    patch_size: 8
    in_channels: 9
  target_pose_tokenizer:
    image_size: 256
    patch_size: 8
    in_channels: 6
  pretrained_path: /home/z50057756/model/VGGT/model.pt
  rae_decoder:
    config_path: /home/z50057756/code/RAE/configs/decoder/ViTXL
    pretrained_decoder_path: /home/z50057756/model/RAE/decoders/dinov2/wReg_base/ViTXL_n08_i512/model.pt
    normalization_stat_path: /home/z50057756/model/RAE/stats/dinov2/wReg_base/imagenet1k_512/stat.pt
    latent_dim: 768
    decoder_patch_size: 16
exp_name: SMOKE_uni3t
unposed: true
training:
  amp_dtype: bf16
  use_bf16: false
  api_key_path: ./configs/api_keys.yaml
  batch_size_per_gpu: 2
  beta1: 0.9
  beta2: 0.95
  allowed_gradnorm_factor: 5000
  checkpoint_dir: /home/z50057756/tmp/uni3t_smoke/${exp_name}
  checkpoint_every: 10000
  dataset_name: data.dataset_objaverse.ObjaverseDataset
  dataset_path: data/objaverse_all287k.txt
  root_path: /mnt/data-alpha-sg-02/team-camera/datasets/trellis_processed/all_train_renders
  use_tar: true
  tar_root_path: /mnt/data-alpha-sg-02/team-camera/datasets/trellis_processed/all_train_renders
  roll_augment_max_deg: 10.0
  grad_accum_steps: 1
  grad_checkpoint_every: 1
  grad_clip_norm: 1.0
  l2_loss_weight: 1.0
  lpips_loss_weight: 0.0
  perceptual_loss_weight: 0.5
  weight_camera: 1.0
  weight_point: 0.2
  lr: 3.5e-05
  scheduler_type: constant
  fused_adamw: true
  exclude_bg_frac: 0.111111
  train_steps: 60
  total_frames_per_obj: 40
  num_input_views: 4
  num_target_views: 6
  num_threads: 8
  num_views: 10
  num_workers: 4
  prefetch_factor: 4
  print_every: 5
  square_crop: true
  target_has_input: true
  target_has_input_prob: 0.1
  use_amp: true
  use_rel_pose: false
  use_tf32: true
  view_selector:
    max_frame_dist: 192
    min_frame_dist: 25
  vis_every: 200
  wandb_exp_name: ${exp_name}
  wandb_log_every: 5
  wandb_project: PLN2_lagernvs
  warmup: 10
  weight_decay: 0.05
  unfreeze_rae_decoder_at: 1.05
  decoder_lr: 3.0e-05
  decoder_weight_decay: 0.01
  feature_alignment:
    enabled: false
    layer_idx: 7
    weight: 0.5
    only_target_view: true
    target_encoder_weights: /home/z50057756/.cache/torch/hub/checkpoints/dinov3_vitl16_pretrain_lvd1689m-8aa4cbdd.pth
    target_encoder_hub_dir: /home/z50057756/.cache/torch/hub/facebookresearch_dinov3_94a96ac83c2446f15f9bdcfae23cad3c6a9d4988
    target_resolution: 512
  val_dataset_name: data.dataset_gso_ours.GSODataset_ours
  validation_out_dir: /home/z50057756/tmp/uni3t_smoke/${exp_name}
  val_dataset_cfgs:
    root_dir: /home/z50057756/data/gso_sim2real_25v
    suffix: ''
    split_file: data/gso_subset64.txt
    if_inference: true
    training:
      batch_size_per_gpu: 1
      num_views: 14
      num_input_views: 4
      num_target_views: 10
      target_has_input: false
  cam_cond_zero_p: 0.4
  val_cam_cond_zero_p: 0.0
inference:
  render_video: false
  compute_metrics: true
