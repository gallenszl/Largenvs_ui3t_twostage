model:
  class_name: model.vggt.models.RnG.VGGT4LVSM

  image_tokenizer:
    image_size: 448
    patch_size: 14
    in_channels: 9  # 3 RGB + 3 direction + 3 Reference

  target_pose_tokenizer:
    image_size: 448
    patch_size: 14
    in_channels: 6  # 3 direction + 3 Reference

  pretrained_path: /home/z50057756/model/VGGT/model.pt

  rae_decoder:
    config_path: /home/z50057756/code/RAE/configs/decoder/ViTXL
    pretrained_decoder_path: /home/z50057756/model/RAE/decoders/dinov2/wReg_base/ViTXL_n08_i512/model.pt
    normalization_stat_path: /home/z50057756/model/RAE/stats/dinov2/wReg_base/imagenet1k_512/stat.pt
    latent_dim: 768
    decoder_patch_size: 16

exp_name:
  RnGUP_obj_256P8_b2v3a4Bf16

unposed: true

training:
  amp_dtype: bf16
  use_bf16: true # can only set transformer weights to bf16, DPT head must use float32
  api_key_path: ./configs/api_keys.yaml
  batch_size_per_gpu: 8
  beta1: 0.9
  beta2: 0.95
  allowed_gradnorm_factor: 5000
  checkpoint_dir: ./experiments/checkpoints/${exp_name}
  checkpoint_every: 2000
  dataset_name: data.dataset_objaverse.ObjaverseDataset
  dataset_path: data/objaverse_v1_in_lvis_25v.txt
  root_path: /home/z50057756/FluffyElephant
  # Flip to true to pull frames straight out of <hash>.tar instead of loose files.
  # use_tar: true
  # tar_root_path: /home/z50057756/FluffyElephant_tar
  grad_accum_steps: 1
  grad_checkpoint_every: 1
  grad_clip_norm: 1.0

  l2_loss_weight: 1.0
  lpips_loss_weight: 0.0
  perceptual_loss_weight: 0.5

  ### for reconstruction
  weight_camera: 1.0
  weight_point: 0.2

  # lr: 0.0004
  lr: 0.0006
  train_steps: 15000

  total_frames_per_obj: 25
  num_input_views: 4
  num_target_views: 3
  num_threads: 8
  num_views: 25
  num_workers: 8
  prefetch_factor: 4
  print_every: 20

  square_crop: true
  target_has_input: true
  use_amp: true
  use_rel_pose: false
  use_tf32: true
  view_selector:
    max_frame_dist: 192
    min_frame_dist: 25
  vis_every: 200
  wandb_exp_name: ${exp_name}
  wandb_log_every: 50
  
  wandb_project: LVSM_obj
  warmup: 3000
  weight_decay: 0.05

  # RAE decoder 渐进解冻: 0 = 从开始不冻结, 0.001 = 0.1%后解冻, 0.2 = 20%后解冻
  unfreeze_rae_decoder_at: 1.05

  # RAE decoder differential learning rate (lower lr to preserve pretrained features)
  decoder_lr: 0.00003
  decoder_weight_decay: 0.01

  # REPA-style feature alignment (target view only)
  # Phase 1: flips all 4 broken knobs from prior failed `rae_latent` experiment
  #   layer_idx=7  -> 8th of 24 aggregator blocks (~33% depth, REPA sweet spot)
  #   weight=0.5   -> matches REPA / iREPA default
  #   target encoder = DINOv3-ViT-L (different family than DINOv2 backbone)
  #   target_resolution=512 -> DINOv3 grid 32x32 matches aggregator 448/14=32 exactly
  #                            (no spatial interpolation on z_pred, per-token 1:1 supervision)
  #   projector = Conv2d(1024, 1024, k=3, p=1)  [in code]
  #   loss      = negative cosine similarity    [in code]
  feature_alignment:
    enabled: true
    layer_idx: 17           # was 7 (Phase 1, 33% depth) → now 17 (Exp 9, 71% depth)
    weight: 0.5
    only_target_view: true
    target_encoder_weights: /home/z50057756/.cache/torch/hub/checkpoints/dinov3_vitl16_pretrain_lvd1689m-8aa4cbdd.pth
    target_encoder_hub_dir: /home/z50057756/.cache/torch/hub/facebookresearch_dinov3_94a96ac83c2446f15f9bdcfae23cad3c6a9d4988
    target_resolution: 512

  # val_dataset_name: data.dataset_gso.GSODataset
  val_dataset_name: data.dataset_gso_ours.GSODataset_ours
  validation_out_dir: ./experiments/checkpoints/${exp_name}
  val_dataset_cfgs:
    root_dir: /home/z50057756/FluffyElephant/gso_render_rv
    suffix: render_mvs_25/model/
    split_file: data/gso_subset64.txt
    # split_file: data/gso.txt
    if_inference: True
    # image_size: 256
    # patch_size: 8

    # for model.process_val_data
    training:
      batch_size_per_gpu: 1
      num_views: 14
      num_input_views: 4
      num_target_views: 10
      target_has_input: false

inference:
  render_video: False
  compute_metrics: True