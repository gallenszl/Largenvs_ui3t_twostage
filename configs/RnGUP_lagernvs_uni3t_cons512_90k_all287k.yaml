# Main arm: const config + track-consistency loss (512 tracks per query view, Omega sampling). Differs from
# RnGUP_lagernvs_uni3t_b32t6_fp32lr35_const_90k_all287k.yaml only in exp_name and the keys under 'training:' below.
model:
  class_name: model.lagernvs_wrapper.LagerNVSInRnG
  # UNI3T: three tasks at once. enabled=false reproduces the dense NVS-only arm
  # PLN2pose_all287k_b32t6_fp32lr35_const bit-for-bit.
  unified_heads:
    enabled: true
    renderer_dpt_layers: [2, 5, 8, 11]
  image_tokenizer:
    image_size: 256
    patch_size: 8
    in_channels: 9
  target_pose_tokenizer:
    image_size: 256
    patch_size: 8
    in_channels: 6
  pretrained_path: /home/z50057756/model/VGGT/model.pt
  rae_decoder:
    config_path: /home/z50057756/code/RAE/configs/decoder/ViTXL
    pretrained_decoder_path: /home/z50057756/model/RAE/decoders/dinov2/wReg_base/ViTXL_n08_i512/model.pt
    normalization_stat_path: /home/z50057756/model/RAE/stats/dinov2/wReg_base/imagenet1k_512/stat.pt
    latent_dim: 768
    decoder_patch_size: 16
exp_name: PLN2uni3t_cons512_all287k_b32t6_fp32lr35_const
unposed: true
training:
  # track-consistency loss between the target views (VGGT-Omega open-source style); plan 2026-09-29
  weight_consistency: 0.2
  consistency:
    tau: 0.01
    abs_tol: 0.0
    neighbours: centre4
    border: 4
    num_tracks: 512
    sampling: omega
    query_views: all
    min_valid: 1
  ckpt_keep_latest: 2
  ckpt_keep_steps: [30000, 60000, 90000]
  amp_dtype: bf16
  use_bf16: false
  api_key_path: /home/z50057756/code/RnG_lagernvs/configs/api_keys.yaml   # read-only reference (never copied)
  batch_size_per_gpu: 8
  beta1: 0.9
  beta2: 0.95
  allowed_gradnorm_factor: 5000
  checkpoint_dir: /mnt/data-alpha-sg-01/team-camera/home/z50057756/moe_experiments/checkpoints/${exp_name}
  checkpoint_every: 2000
  dataset_name: data.dataset_objaverse.ObjaverseDataset
  dataset_path: data/objaverse_all287k.txt
  root_path: /mnt/data-alpha-sg-02/team-camera/datasets/trellis_processed/all_train_renders
  use_tar: true
  tar_root_path: /mnt/data-alpha-sg-02/team-camera/datasets/trellis_processed/all_train_renders
  roll_augment_max_deg: 10.0
  grad_accum_steps: 1
  grad_checkpoint_every: 1
  grad_clip_norm: 1.0
  l2_loss_weight: 1.0
  lpips_loss_weight: 0.0
  perceptual_loss_weight: 0.5
  weight_camera: 1.0
  weight_point: 0.2
  lr: 3.5e-05
  scheduler_type: constant
  fused_adamw: true
  exclude_bg_frac: 0.111111
  train_steps: 90000
  total_frames_per_obj: 40
  num_input_views: 4
  num_target_views: 6
  num_threads: 8
  num_views: 10
  num_workers: 8
  prefetch_factor: 4
  print_every: 20
  square_crop: true
  target_has_input: true
  target_has_input_prob: 0.1
  use_amp: true
  use_rel_pose: false
  use_tf32: true
  view_selector:
    max_frame_dist: 192
    min_frame_dist: 25
  vis_every: 200
  wandb_exp_name: ${exp_name}
  wandb_log_every: 50
  wandb_project: PLN2_lagernvs
  warmup: 3000
  weight_decay: 0.05
  unfreeze_rae_decoder_at: 1.05
  decoder_lr: 3.0e-05
  decoder_weight_decay: 0.01
  feature_alignment:
    enabled: false
    layer_idx: 7
    weight: 0.5
    only_target_view: true
    target_encoder_weights: /home/z50057756/.cache/torch/hub/checkpoints/dinov3_vitl16_pretrain_lvd1689m-8aa4cbdd.pth
    target_encoder_hub_dir: /home/z50057756/.cache/torch/hub/facebookresearch_dinov3_94a96ac83c2446f15f9bdcfae23cad3c6a9d4988
    target_resolution: 512
  val_dataset_name: data.dataset_gso_ours.GSODataset_ours
  validation_out_dir: /mnt/data-alpha-sg-01/team-camera/home/z50057756/moe_experiments/checkpoints/${exp_name}
  val_dataset_cfgs:
    root_dir: /home/z50057756/data/gso_sim2real_25v
    suffix: ''
    split_file: data/gso_subset64.txt
    if_inference: true
    training:
      batch_size_per_gpu: 1
      num_views: 14
      num_input_views: 4
      num_target_views: 10
      target_has_input: false
  cam_cond_zero_p: 0.4
  val_cam_cond_zero_p: 0.0
inference:
  render_video: false
  compute_metrics: true
