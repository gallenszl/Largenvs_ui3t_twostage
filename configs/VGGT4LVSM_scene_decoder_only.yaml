model:
  class_name: model.vggt.models.vggt.VGGT4LVSM

  image_tokenizer:
    image_size: 256
    patch_size: 8
    in_channels: 9  # 3 RGB + 3 direction + 3 Reference

  target_pose_tokenizer:
    image_size: 256
    patch_size: 8
    in_channels: 6  # 3 direction + 3 Reference

  pretrained_path: experiments/pretrained/vggt_model.pt

training:
  amp_dtype: bf16
  api_key_path: ./configs/api_keys.yaml
  batch_size_per_gpu: 2
  beta1: 0.9
  beta2: 0.95
  allowed_gradnorm_factor: 10
  center_crop: true
  scene_scale_factor: 1.35
  checkpoint_dir: ./experiments/checkpoints/VGGT_256P8_4LVSM
  checkpoint_every: 40000
  # dataset_name: data.dataset_scene.Dataset
  # dataset_path: /workspace/xinghan_vuc_3dc/re10k/re10k_imgs/train/full_list.txt
  dataset_name: data.dataset_scene_video.Dataset
  dataset_path: /workspace/mochu_workspace/re10k_train_video/full_list.txt

  grad_accum_steps: 1
  grad_checkpoint_every: 1
  grad_clip_norm: 1.0

  l2_loss_weight: 1.0
  lpips_loss_weight: 0.0
  perceptual_loss_weight: 0.5

  # lr: 0.0004
  lr: 0.0006
  train_steps: 400000


  num_input_views: 2
  num_target_views: 6
  num_views: 8
  print_every: 20


  num_threads: 8
  num_workers: 8
  prefetch_factor: 8

  square_crop: true
  target_has_input: true
  use_amp: true
  use_rel_pose: false
  use_tf32: true
  view_selector:
    max_frame_dist: 192
    min_frame_dist: 25
  vis_every: 1000
  wandb_exp_name: VGGT_256P8_4LVSM_scene
  wandb_log_every: 50
  
  wandb_project: LVSM
  warmup: 6000
  weight_decay: 0.05


# inference / evaluation
inference:
  if_inference: False
  compute_metrics: False
  view_idx_file_path: ./data/evaluation_index_re10k.json
  render_video: False
  render_video_config:
    traj_type: interpolate
    num_frames: 60
    loop_video: True 
    order_poses: False

  