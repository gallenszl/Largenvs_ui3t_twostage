model:
  class_name: model.vggt.models.vggt.VGGT4LVSM

  image_tokenizer:
    image_size: 256
    patch_size: 8
    in_channels: 9  # 3 RGB + 3 direction + 3 Reference

  target_pose_tokenizer:
    image_size: 256
    patch_size: 8
    in_channels: 6  # 3 direction + 3 Reference

  pretrained_path: experiments/pretrained/vggt_model.pt

training:
  amp_dtype: bf16
  api_key_path: ./configs/api_keys.yaml
  batch_size_per_gpu: 2
  beta1: 0.9
  beta2: 0.95
  allowed_gradnorm_factor: 15
  checkpoint_dir: ./experiments/checkpoints/VGGT_obj_256P8
  checkpoint_every: 4000
  dataset_name: data.dataset_objaverse.ObjaverseDataset
  dataset_path: data/objaverse_v1_in_lvis_25v.txt
  root_path: /workspace/ssd1/objaverse_renderings_25v
  grad_accum_steps: 4
  grad_checkpoint_every: 1
  grad_clip_norm: 1.0

  l2_loss_weight: 1.0
  lpips_loss_weight: 0.0
  perceptual_loss_weight: 0.5

  # lr: 0.0004
  lr: 0.0006
  train_steps: 200000

  total_frames_per_obj: 25
  num_input_views: 4
  num_target_views: 4
  num_threads: 8
  num_views: 25
  num_workers: 6
  prefetch_factor: 32
  print_every: 20

  square_crop: true
  target_has_input: true
  use_amp: true
  use_rel_pose: false
  use_tf32: true
  view_selector:
    max_frame_dist: 192
    min_frame_dist: 25
  vis_every: 200
  wandb_exp_name: VGGT_obj_256P8
  wandb_log_every: 50
  
  wandb_project: LVSM_obj
  warmup: 3000
  weight_decay: 0.05

  # val_dataset_name: data.dataset_gso.GSODataset
  val_dataset_name: data.dataset_gso_ours.GSODataset_ours
  validation_out_dir: ./experiments/checkpoints/VGGT_obj_256P8
  val_dataset_cfgs:
    root_dir: /workspace/ssd1/gso_render
    suffix: render_mvs_25/model/
    split_file: data/gso_subset64.txt
    if_inference: True
    image_size: 256
    patch_size: 8 

inference:
  render_video: False
  compute_metrics: True