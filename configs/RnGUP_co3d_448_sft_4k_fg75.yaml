model:
  class_name: model.vggt.models.RnG.VGGT4LVSM

  image_tokenizer:
    image_size: 448
    patch_size: 14
    in_channels: 9  # 3 RGB + 3 direction + 3 Reference

  target_pose_tokenizer:
    image_size: 448
    patch_size: 14
    in_channels: 6  # 3 direction + 3 Reference

  # NOTE: all pretrained weights live on the OLD home (data-alpha); the new-home
  # copies do not exist (verified 2026-07-08). Same override style as
  # scripts/inference_gso_sim2real.sh.
  pretrained_path: /mnt/data-alpha-sg-01/team-camera/home/z50057756/model/VGGT/model.pt

  rae_decoder:
    config_path: /home/z50057756/code/RAE/configs/decoder/ViTXL
    pretrained_decoder_path: /mnt/data-alpha-sg-01/team-camera/home/z50057756/model/RAE/decoders/dinov2/wReg_base/ViTXL_n08_i512/model.pt
    normalization_stat_path: /mnt/data-alpha-sg-01/team-camera/home/z50057756/model/RAE/stats/dinov2/wReg_base/imagenet1k_512/stat.pt
    latent_dim: 768
    decoder_patch_size: 16

exp_name:
  RnGUP_co3d_448_sft_fg75

unposed: true

training:
  amp_dtype: bf16
  use_bf16: true # can only set transformer weights to bf16, DPT head must use float32
  api_key_path: ./configs/api_keys.yaml
  batch_size_per_gpu: 8
  beta1: 0.9
  beta2: 0.95
  allowed_gradnorm_factor: 5000
  checkpoint_dir: ./experiments/checkpoints/${exp_name}
  checkpoint_every: 500
  dataset_name: data.dataset_objaverse.ObjaverseDataset
  # V11 CO3D SFT: certified 22064 minus eval blacklist (125 = 5cat eval scenes)
  # minus the whole toybus category (unseen-category axis) = 21,803 scenes / 46 cats.
  # bear(teddybear, never in train cats) + toybus = unseen-category generalization;
  # backpack/book/hydrant/toytruck = seen-category unseen-instance generalization.
  dataset_path: data/co3d_train_sft_21803.txt
  root_path: /home/z50057756/data/co3d_train_gsoformat_sam3mask
  # gsoformat scenes are plain directories (NNN.png / NNN_depth.png / transforms.json)
  use_tar: false
  # CO3D is real handheld capture: natural roll already present, no synthetic roll augment.
  roll_augment_max_deg: 0.0
  grad_accum_steps: 1
  grad_checkpoint_every: 1
  grad_clip_norm: 1.0

  l2_loss_weight: 1.0
  lpips_loss_weight: 0.0
  perceptual_loss_weight: 0.5

  ### for reconstruction
  weight_camera: 1.0
  weight_point: 0.2

  # V12: fg-masked L2 for the first 75% of steps (V11 default 0.25 switched at step
  # 1000 and cost -1.65dB FG-PSNR; see ~/tmp/co3d_sft_results/README.md ablation).
  exclude_bg_frac: 0.75

  # SFT from ckpt_15000 (pretrain peak lr 6e-4): 1/6 peak, cosine to 0.
  lr: 0.0001
  train_steps: 4000

  # CO3D gsoformat has exactly 25 views per scene (40 would FileNotFoundError).
  total_frames_per_obj: 25
  num_input_views: 4
  num_target_views: 3
  num_threads: 8
  num_views: 7
  num_workers: 8
  prefetch_factor: 4
  print_every: 20

  square_crop: true
  # target_has_input 现在是 fallback,当 target_has_input_prob 未设时使用。
  target_has_input: true
  target_has_input_prob: 0.1
  use_amp: true
  use_rel_pose: false
  use_tf32: true
  view_selector:
    max_frame_dist: 192
    min_frame_dist: 25
  vis_every: 200
  wandb_exp_name: ${exp_name}
  wandb_log_every: 50

  wandb_project: LVSM_obj
  warmup: 300
  weight_decay: 0.05

  # RAE decoder stays frozen for SFT (1.05 = never unfreeze), same as pretrain.
  unfreeze_rae_decoder_at: 1.05

  # RAE decoder differential learning rate (moot while frozen, kept for parity)
  decoder_lr: 0.00003
  decoder_weight_decay: 0.01

  # REPA-style feature alignment (target view only).
  # layer_idx MUST stay 7: the projector inside ckpt_15000 was trained for layer 7.
  feature_alignment:
    enabled: true
    layer_idx: 7
    weight: 0.5
    only_target_view: true
    target_encoder_weights: /mnt/data-alpha-sg-01/team-camera/home/z50057756/.cache/torch/hub/checkpoints/dinov3_vitl16_pretrain_lvd1689m-8aa4cbdd.pth
    target_encoder_hub_dir: /mnt/data-alpha-sg-01/team-camera/home/z50057756/.cache/torch/hub/facebookresearch_dinov3_94a96ac83c2446f15f9bdcfae23cad3c6a9d4988
    target_resolution: 512

  val_dataset_name: data.dataset_gso_ours.GSODataset_ours
  validation_out_dir: ./experiments/checkpoints/${exp_name}
  # During-training val = the user-designated 5cat CO3D eval set (objdepth):
  # backpack/book/hydrant/toybus/toytruck x 25 (all blacklisted out of training).
  # GSODataset_ours picks a fixed seed(0) 14-of-25 frames per scene -> curves are
  # strictly comparable across steps and experiments. No pose AUC here (final eval only).
  val_dataset_cfgs:
    root_dir: /home/z50057756/data/co3d_5cat_eval_gsoformat_objdepth
    split_file: data/co3d_5cat_eval125.txt
    if_inference: True

    # for model.process_val_data
    training:
      batch_size_per_gpu: 1
      num_views: 14
      num_input_views: 4
      num_target_views: 10
      target_has_input: false

inference:
  render_video: False
  compute_metrics: True
